task:
  name: tidy_table
  description: "Tidy the table: gather all items near the bowl in a specific arrangement"

  steps:
    # Step 1: Pick banana
    - action: pick
      object: banana
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 2: Place banana in the bowl
    - action: place
      destination:
        reference: bowl
        offset: {x: 0.0, y: 0.0, z: 0.06}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 3: Pick cereal
    - action: pick
      object: cereal
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 4: Place cereal behind the bowl
    - action: place
      destination:
        reference: bowl
        offset: {x: 0.15, y: 0.0, z: 0.0}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 5: Pick milk
    - action: pick
      object: milk_carton
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 6: Place milk to the left of the bowl
    - action: place
      destination:
        reference: bowl
        offset: {x: -0.15, y: 0.0, z: 0.0}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 7: Pick banana back out of the bowl
    - action: pick
      object: banana
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 8: Place banana in front of the bowl
    - action: place
      destination:
        reference: bowl
        offset: {x: 0.0, y: -0.15, z: 0.0}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

  goals:
    - description: "Cereal is near the bowl"
      type: near
      object: cereal
      reference: bowl
      max_distance_xy: 0.25

    - description: "Milk is near the bowl"
      type: near
      object: milk_carton
      reference: bowl
      max_distance_xy: 0.25

    - description: "Banana is near the bowl"
      type: near
      object: banana
      reference: bowl
      max_distance_xy: 0.25

    - description: "All items on table"
      type: on_table
      object: banana
      table_z_world: 1.022
      tolerance: 0.10
