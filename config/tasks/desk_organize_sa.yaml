task:
  name: desk_organize_sa
  description: "Desk organization: place mug near phone, book on stapler, pen_cup near mug"
  scene: scene_desk

  states:
    initial:
      description: "Nothing picked up"
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: holding_mug
        - id: pick_book
          action: pick
          object: book
          next_state: holding_book
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: holding_pen_cup

    # Mug first path
    holding_mug:
      valid_goals:
        - id: place_mug
          action: place
          destination: {reference: phone, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: mug_done

    mug_done:
      valid_goals:
        - id: pick_book
          action: pick
          object: book
          next_state: holding_book_after_mug
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: holding_pen_cup_after_mug

    holding_book_after_mug:
      valid_goals:
        - id: place_book
          action: place
          destination: {reference: stapler, offset: {x: 0.0, y: 0.0, z: 0.06}}
          next_state: mug_book_done

    mug_book_done:
      valid_goals:
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: holding_pen_cup_final

    holding_pen_cup_after_mug:
      valid_goals:
        - id: place_pen_cup
          action: place
          destination: {reference: mug, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: mug_pen_done

    mug_pen_done:
      valid_goals:
        - id: pick_book
          action: pick
          object: book
          next_state: holding_book_final

    # Book first path
    holding_book:
      valid_goals:
        - id: place_book
          action: place
          destination: {reference: stapler, offset: {x: 0.0, y: 0.0, z: 0.06}}
          next_state: book_done

    book_done:
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: holding_mug_after_book
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: holding_pen_cup_after_book

    holding_mug_after_book:
      valid_goals:
        - id: place_mug
          action: place
          destination: {reference: phone, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: book_mug_done

    book_mug_done:
      valid_goals:
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: holding_pen_cup_final

    holding_pen_cup_after_book:
      valid_goals:
        - id: place_pen_cup
          action: place
          destination: {reference: mug, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: book_pen_done

    book_pen_done:
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: holding_mug_final

    # Pen cup first path
    holding_pen_cup:
      valid_goals:
        - id: place_pen_cup
          action: place
          destination: {reference: mug, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: pen_done

    pen_done:
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: holding_mug_after_pen
        - id: pick_book
          action: pick
          object: book
          next_state: holding_book_after_pen

    holding_mug_after_pen:
      valid_goals:
        - id: place_mug
          action: place
          destination: {reference: phone, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: pen_mug_done

    pen_mug_done:
      valid_goals:
        - id: pick_book
          action: pick
          object: book
          next_state: holding_book_final

    holding_book_after_pen:
      valid_goals:
        - id: place_book
          action: place
          destination: {reference: stapler, offset: {x: 0.0, y: 0.0, z: 0.06}}
          next_state: pen_book_done

    pen_book_done:
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: holding_mug_final

    # Final states (last object to place)
    holding_mug_final:
      valid_goals:
        - id: place_mug
          action: place
          destination: {reference: phone, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: done

    holding_book_final:
      valid_goals:
        - id: place_book
          action: place
          destination: {reference: stapler, offset: {x: 0.0, y: 0.0, z: 0.06}}
          next_state: done

    holding_pen_cup_final:
      valid_goals:
        - id: place_pen_cup
          action: place
          destination: {reference: mug, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: done

    done:
      description: "All done"
      valid_goals: []

  goals:
    - description: "Mug near phone"
      type: near
      object: mug
      reference: phone
      max_distance_xy: 0.20
    - description: "Book near stapler"
      type: near
      object: book
      reference: stapler
      max_distance_xy: 0.15
    - description: "Pen cup near mug"
      type: near
      object: pen_cup
      reference: mug
      max_distance_xy: 0.20
