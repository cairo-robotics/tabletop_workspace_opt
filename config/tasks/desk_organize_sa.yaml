task:
  name: desk_organize_sa
  description: "Desk organization: place mug near phone, pen_cup near mug, vase near book"
  # book was removed as a pickable because it is too flat to pick reliably
  # with the current gripper (half-extent z = 0.015). It remains in the
  # scene as a landmark for the vase place target.
  scene: scene_desk

  states:
    # --- nothing placed yet: 3 competing picks ---
    initial:
      description: "Nothing placed"
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: h_mug
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: h_pen
        - id: pick_vase
          action: pick
          object: vase
          next_state: h_vase

    h_mug:
      valid_goals:
        - id: place_mug
          action: place
          destination: {reference: phone, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: s_m
    h_pen:
      valid_goals:
        - id: place_pen_cup
          action: place
          destination: {reference: mug, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: s_p
    h_vase:
      valid_goals:
        - id: place_vase
          action: place
          destination: {reference: book, offset: {x: 0.15, y: 0.0, z: 0.08}}
          next_state: s_v

    # --- one placed: 2 competing picks ---
    s_m:
      valid_goals:
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: h_pen_m
        - id: pick_vase
          action: pick
          object: vase
          next_state: h_vase_m
    s_p:
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: h_mug_p
        - id: pick_vase
          action: pick
          object: vase
          next_state: h_vase_p
    s_v:
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: h_mug_v
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: h_pen_v

    h_pen_m:
      valid_goals:
        - id: place_pen_cup
          action: place
          destination: {reference: mug, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: s_mp
    h_vase_m:
      valid_goals:
        - id: place_vase
          action: place
          destination: {reference: book, offset: {x: 0.15, y: 0.0, z: 0.08}}
          next_state: s_mv
    h_mug_p:
      valid_goals:
        - id: place_mug
          action: place
          destination: {reference: phone, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: s_mp
    h_vase_p:
      valid_goals:
        - id: place_vase
          action: place
          destination: {reference: book, offset: {x: 0.15, y: 0.0, z: 0.08}}
          next_state: s_pv
    h_mug_v:
      valid_goals:
        - id: place_mug
          action: place
          destination: {reference: phone, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: s_mv
    h_pen_v:
      valid_goals:
        - id: place_pen_cup
          action: place
          destination: {reference: mug, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: s_pv

    # --- two placed: 1 pick remaining ---
    s_mp:
      valid_goals:
        - id: pick_vase
          action: pick
          object: vase
          next_state: h_vase_final
    s_mv:
      valid_goals:
        - id: pick_pen_cup
          action: pick
          object: pen_cup
          next_state: h_pen_final
    s_pv:
      valid_goals:
        - id: pick_mug
          action: pick
          object: mug
          next_state: h_mug_final

    h_vase_final:
      valid_goals:
        - id: place_vase
          action: place
          destination: {reference: book, offset: {x: 0.15, y: 0.0, z: 0.08}}
          next_state: done
    h_pen_final:
      valid_goals:
        - id: place_pen_cup
          action: place
          destination: {reference: mug, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: done
    h_mug_final:
      valid_goals:
        - id: place_mug
          action: place
          destination: {reference: phone, offset: {x: 0.0, y: 0.12, z: 0.06}}
          next_state: done

    done:
      description: "All done"
      valid_goals: []

  goals:
    - description: "Mug near phone"
      type: near
      object: mug
      reference: phone
      max_distance_xy: 0.20
    - description: "Pen cup near mug"
      type: near
      object: pen_cup
      reference: mug
      max_distance_xy: 0.20
    - description: "Vase near book"
      type: near
      object: vase
      reference: book
      max_distance_xy: 0.25
