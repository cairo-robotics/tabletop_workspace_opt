task:
  name: pour_cereal
  description: "Pick up cereal box, pour above the bowl, then place it back on the table"

  steps:
    # Step 1: Pick up the cereal box
    - action: pick
      object: cereal
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 2: Pour cereal above the bowl (high enough to clear the bowl rim)
    # Step 2: Pour cereal above the bowl
    #   45 degree tilt toward -y (away from milk carton)
    - action: pour
      destination:
        reference: bowl
        offset: {x: 0.0, y: 0.0, z: 0.45}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}
      pour_orientation: {qx: 0.924, qy: 0.0, qz: 0.0, qw: 0.383}
      hold_time: 3.0

    # Step 3: Place cereal closer to robot and higher off table
    - action: place
      destination:
        reference: bowl
        offset: {x: -0.20, y: 0.10, z: 0.08}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

  goals:
    - description: "Cereal is near the bowl"
      type: near
      object: cereal
      reference: bowl
      max_distance_xy: 0.25

    - description: "Cereal is on the table"
      type: on_table
      object: cereal
      table_z_world: 1.022
      tolerance: 0.10
