task:
  name: pour_cereal
  description: "Pick up cereal box, move it above the bowl, tilt to pour, then place it back"

  steps:
    # Step 1: Pick up the cereal box
    - action: pick
      object: cereal
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Step 2: Move cereal above the bowl (pour position)
    - action: place
      destination:
        reference: bowl
        offset: {x: 0.0, y: 0.0, z: 0.15}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

  goals:
    - description: "Cereal is near the bowl"
      type: near
      object: cereal
      reference: bowl
      max_distance_xy: 0.15

    - description: "Cereal is above the bowl"
      type: above
      object: cereal
      reference: bowl
      min_z_offset: 0.05
