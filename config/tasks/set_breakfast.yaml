task:
  name: set_breakfast
  description: "Set the table: place banana in the bowl, then move cereal next to it"

  steps:
    # First: put banana in the bowl
    - action: pick
      object: banana

    - action: place
      destination:
        reference: bowl
        offset: {x: 0.0, y: 0.0, z: 0.06}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

    # Second: move cereal to the left of the bowl
    - action: pick
      object: cereal

    - action: place
      destination:
        reference: bowl
        offset: {x: 0.0, y: -0.15, z: 0.08}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

  goals:
    - description: "Banana is inside the bowl"
      type: near
      object: banana
      reference: bowl
      max_distance_xy: 0.12
    - description: "Cereal is near the bowl"
      type: near
      object: cereal
      reference: bowl
      max_distance_xy: 0.25
    - description: "Cereal is on the table"
      type: on_table
      object: cereal
      table_z_world: 1.022
      tolerance: 0.10
