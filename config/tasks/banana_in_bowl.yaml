task:
  name: banana_in_bowl
  description: "Pick up the banana and place it inside the bowl"

  steps:
    - action: pick
      object: banana

    - action: place
      destination:
        reference: bowl
        offset: {x: 0.0, y: 0.0, z: 0.06}
      orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}

  goals:
    - description: "Banana is inside the bowl"
      type: near
      object: banana
      reference: bowl
      max_distance_xy: 0.12
    - description: "Banana is above the bowl bottom"
      type: above
      object: banana
      reference: bowl
      min_z_offset: -0.03
