grasps:
  cereal:
  - name: down_x_center
    offset:
      x: 0.0
      y: 0.0
      z: 0.218
    orientation:
      qx: 1.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
  banana:
  - name: down_x_center
    offset:
      x: 0.0
