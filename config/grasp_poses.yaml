    orientation:
      qx: 1.0
      qy: 0.0
      qz: 0.0
      qw: 0.0
  milk_carton:
  - name: down_y_narrow
    # Top-down grasp, fingers grip along y-axis (the 60mm narrow side).
    # Gripper rotated 90deg around z so fingers align with x-axis,
    # gripping the 100mm wide side instead. This gives more grip margin.
    offset: {x: 0.0, y: 0.0, z: 0.241}
    orientation: {qx: 0.707, qy: 0.707, qz: 0.0, qw: 0.0}
  - name: down_x_center
    offset: {x: 0.0, y: 0.0, z: 0.241}
    orientation: {qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}
  # spoon: Unreachable with top-down grasp at current scene position
  # [0.650, 0.306, 0.925] - arm can't descend low enough at this distance.
  # Needs side-approach grasp or closer scene placement.

