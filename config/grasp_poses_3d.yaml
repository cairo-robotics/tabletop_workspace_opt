# 3D grasp library for SE(3) shared autonomy.
#
# Exactly one grasp per object. Entries are specified in the object's
# body frame. The `approach.axis` is in the grasp frame: the unit vector
# pointing FROM the pre-grasp TO the grasp.
#
# Offset convention (updated 2026-04-12):
#   Top-down grasps:  offset.z = half_extent_z + 0.0295 (EE-to-fingertip)
#                     so the fingertips just touch the object's top face.
#   Side grasps:      approach-axis offset = half_extent_{x|y} + 0.005
#                     (fingertips 5 mm into the surface). The z offset is
#                     set to mid-height (0.5 * half_extent_z) so the
#                     gripper enters at the object center.
#
# Top-down grasps use axis [0, 0, -1] and orientation (qw, qx, qy, qz)
# = (0, 1, 0, 0) which points the gripper tool axis straight down.
#
# Side grasps use orientations obtained by rotating the top-down quat.
# The approach axis in the grasp frame is still [0, 0, -1] because the
# standoff moves along the gripper tool axis.
#
# Height rule: side grasps are only used for objects with half_extent_z
# > 0.04 (i.e. >= 8 cm total height). Shorter objects get top-down grasps.
#
# Design intent: a mix of top-down and side grasps spreads the approach
# directions across objects so 3D EE motion is maximally informative.
grasps:
  # -------------------- breakfast scene --------------------
  cereal:
    # half_extents: [0.086, 0.023, 0.153]. Top-down.
    name: top_center
    offset: {x: 0.0, y: 0.0, z: 0.1825}
    orientation: {qw: 0.0, qx: 1.0, qy: 0.0, qz: 0.0}
    approach:
      standoff: 0.10
      axis: [0, 0, -1]
  banana:
